name: launch make setup/test/lint
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'npm'
      - name: run make setup
        run: make setup
      - name: run make test
        run: make test
      - name: run make lint
        run: make lint
