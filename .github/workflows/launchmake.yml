name: launch make setup/test/lint
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          cache: 'npm'
      - uses: hexlet-components/hello-from-hexlet-action@release
      - name: run make setup
        run: make setup
      - name: run make test
        run: make test
      - name: run make lint
        run: make lint
